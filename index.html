<!doctype html>
<html lang="en" data-theme="studio">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YOS Radio</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Big+Shoulders+Display:wght@900&family=Figtree:wght@400;500;600;700&family=Gloock&family=Silkscreen&display=swap">
<script>
/* apply the saved theme before first paint */
(function(){ try { var t = localStorage.getItem('yr-theme2'); if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'studio'; document.documentElement.dataset.theme = t; } catch(e){} })();
</script>
<style>
/* Layout: square editorial grid. Header / hero (now playing + framed collage with its reaction bar) / chat ticker / visualizer / fold-out mixer / station index / room.
   Colour comes from five themes drawn from YOS Studio (white, black, signal green) and YOS Shop (flat artwork blocks: orange, slate, butter, brick). */
:root{
  --bg:#ffffff; --fg:#0b0b0b; --dim:rgba(11,11,11,.55); --rule:#0b0b0b;
  --accent:#00ff95; --on-accent:#0b0b0b;
  --viz1:#00ff95; --viz2:#ffffff;
  --f-display:"Archivo","Arial Narrow",Impact,sans-serif;
  --f-body:"Figtree","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-serif:"Gloock","Times New Roman",serif;
  --f-pixel:"Silkscreen",ui-monospace,monospace;
  --pad:clamp(16px,3vw,44px);
  color-scheme:light;
}
:root[data-theme="studio"]{--bg:#ffffff;--fg:#0b0b0b;--dim:rgba(11,11,11,.55);--rule:#0b0b0b;--accent:#00ff95;--on-accent:#0b0b0b;--viz1:#00ff95;--viz2:#ffffff;color-scheme:light}
:root[data-theme="mono"]{--bg:#ffffff;--fg:#000000;--dim:rgba(0,0,0,.55);--rule:#000000;--accent:#000000;--on-accent:#ffffff;--viz1:#ffffff;--viz2:#9a9a9a;color-scheme:light}
:root[data-theme="mono"] .box img{filter:grayscale(1) contrast(1.15)}
:root[data-theme="night"]{--bg:#0c0d0f;--fg:#eceee8;--dim:rgba(236,238,232,.55);--rule:#eceee8;--accent:#00ff95;--on-accent:#0c0d0f;--viz1:#00ff95;--viz2:#eceee8;color-scheme:dark}
:root[data-theme="slate"]{--bg:#64758b;--fg:#f7f2e8;--dim:rgba(247,242,232,.7);--rule:#f7f2e8;--accent:#fadb75;--on-accent:#1f2530;--viz1:#fadb75;--viz2:#e37a6a;color-scheme:dark}
:root[data-theme="ember"]{--bg:#931607;--fg:#fadb75;--dim:rgba(250,219,117,.7);--rule:#fadb75;--accent:#fadb75;--on-accent:#931607;--viz1:#e56b27;--viz2:#fadb75;color-scheme:dark}
:root[data-theme="orange"]{--bg:#e56b27;--fg:#170b04;--dim:rgba(23,11,4,.6);--rule:#170b04;--accent:#170b04;--on-accent:#e56b27;--viz1:#e56b27;--viz2:#fadb75;color-scheme:light}

*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--f-body);-webkit-text-size-adjust:100%;transition:background .35s,color .35s}
body{margin:0;background:var(--bg);color:var(--fg);overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .35s,color .35s}
::selection{background:var(--accent);color:var(--on-accent)}
h1,h2,h3,p,ul,figure{margin:0;padding:0}
ul{list-style:none}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{padding-left:max(var(--pad),env(safe-area-inset-left,0px));padding-right:max(var(--pad),env(safe-area-inset-right,0px))}
.lab{font:600 11px/1.35 var(--f-body);letter-spacing:.1em;text-transform:uppercase}
.display{font-family:var(--f-display);font-stretch:62%;font-weight:850;line-height:.86;text-transform:uppercase;letter-spacing:-.01em}
.serif{font-family:var(--f-serif);font-weight:400}
.dim{color:var(--dim)}

/* buttons */
.b{border:1.5px solid var(--rule);padding:7px 10px 6px;font:600 11px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.b:hover{background:var(--fg);color:var(--bg)}
.b[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.b:disabled{opacity:.4;cursor:default}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1.5px solid var(--rule);transition:background .35s;
  display:flex;align-items:center;gap:12px 22px;flex-wrap:wrap;padding-block:calc(12px + env(safe-area-inset-top,0px)) 12px}
.logo{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:900;font-size:30px;line-height:1;text-transform:uppercase;text-decoration:none;letter-spacing:.01em}
.logo span{color:var(--logo-slash,var(--accent))}
:root[data-theme="studio"] .logo span{color:#00c977}
.onair{display:inline-flex;align-items:center;gap:8px}
.onair i{width:10px;height:10px;border:1.5px solid var(--fg)}
body.playing .onair i{background:var(--accent);border-color:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.sp{flex:1}
.count{display:flex;align-items:baseline;gap:8px}
.count b{font-family:var(--f-display);font-stretch:62%;font-weight:850;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.lang{display:flex}
.lang button{padding:6px 8px;border:1.5px solid var(--rule);font:700 11px/1 var(--f-body)}
.lang button+button{border-left:0}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.themes{display:flex;align-items:center;gap:4px}
.themes button{width:22px;height:22px;border:1.5px solid var(--rule);position:relative}
.themes button[aria-pressed="true"]::after{content:"";position:absolute;inset:4px;border:1.5px solid var(--sw-fg)}
.themes .cycle{display:none;width:34px;height:34px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);border-bottom:1.5px solid var(--rule)}
.now{display:flex;flex-direction:column;gap:18px;padding-block:28px;padding-right:var(--pad);border-right:1.5px solid var(--rule);min-width:0}
.now h1{font-size:clamp(72px,11vw,170px);overflow-wrap:anywhere}
.now h1 a{text-decoration:none}
.now h1 a:hover{text-decoration:underline;text-decoration-thickness:.05em;text-underline-offset:.08em}
.show{font-size:clamp(22px,2.3vw,32px);line-height:1.12;min-height:2.24em;overflow-wrap:anywhere}
.show em{font-style:normal;color:var(--dim)}
.transport{display:flex;flex-wrap:wrap;align-items:stretch;gap:0}
.play{background:var(--accent);color:var(--on-accent);font-family:var(--f-display);font-stretch:62%;font-weight:850;text-transform:uppercase;font-size:32px;line-height:1;
  padding:14px 22px 12px;display:inline-flex;gap:12px;align-items:center;border:1.5px solid var(--accent)}
.play:hover{background:var(--fg);border-color:var(--fg);color:var(--bg)}
body.playing .play{background:var(--bg);color:var(--fg);border-color:var(--rule)}
.decks{display:grid;grid-template-columns:auto auto;gap:2px 12px;align-content:center;padding:8px 16px;border:1.5px solid var(--rule);border-left:0;min-width:0}
.decks b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mixbtn{border:1.5px solid var(--rule);border-left:0;padding:0 16px;display:inline-flex;align-items:center;gap:8px}
.mixbtn:hover{background:var(--fg);color:var(--bg)}
.mixbtn[aria-expanded="true"]{background:var(--fg);color:var(--bg)}
.mixbtn .chev{display:inline-block;transition:transform .2s}
.mixbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.frame{padding:var(--pad);padding-right:0;display:grid;align-content:start;min-width:0}
.box{position:relative;aspect-ratio:16/9;max-width:100%;border:1.5px solid var(--rule);overflow:hidden;background:#000}
.box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(calc(1 + var(--pulse,0) * .02))}
.box.hype{outline:4px solid var(--accent);outline-offset:-4px}
#ink{position:absolute;inset:0;width:100%;height:100%;z-index:2}
body.drawing #ink{cursor:crosshair;touch-action:none}
.floats{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.float{position:absolute;font-family:var(--f-display);font-stretch:62%;font-weight:850;font-size:48px;line-height:1;text-transform:uppercase;padding:4px 10px 1px;color:#fff;
  transform:translate(-50%,-50%);animation:rise 2.4s cubic-bezier(.19,1,.22,1) forwards;white-space:nowrap}
.float.msg{font:600 14px/1.3 var(--f-body);text-transform:none;padding:6px 10px;max-width:70%;white-space:normal;animation-duration:4.5s}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-20%) scale(.7)}8%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-220%) scale(1)}}
.rbar{display:flex;flex-wrap:wrap;border:1.5px solid var(--rule);border-top:0}
.rbar>*{border-right:1.5px solid var(--rule)}
.rbar .rx{font-family:var(--f-display);font-stretch:62%;font-weight:850;font-size:26px;line-height:1;padding:10px 14px 7px;min-width:56px}
.rbar .rx:hover{background:var(--accent);color:var(--on-accent)}
.rbar .rx:active{transform:translateY(2px)}
.rbar .tool{font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:0 14px;min-height:44px}
.rbar .tool[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.rbar .energy{flex:1;display:flex;align-items:center;gap:10px;padding:8px 14px;border-right:0;min-width:180px}
.segs{display:flex;gap:3px;flex:1}
.segs i{flex:1;height:14px;background:var(--fg);opacity:.14}
.segs i.on{opacity:1}
.segs i.hot{background:var(--accent);opacity:1;box-shadow:inset 0 0 0 1.5px var(--fg)}
.cap{display:flex;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;color:var(--dim);padding-top:10px}
.cap b{color:var(--fg)}
.cap .seg{display:flex;gap:4px;flex-wrap:wrap}
.cap .seg button{padding:2px 6px;border:1px solid var(--rule);color:var(--fg)}
.cap .seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* chat ticker */
.chat{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(220px,360px);border-bottom:1.5px solid var(--rule);align-items:stretch}
.chat .clbl{display:flex;align-items:center;padding-right:16px;border-right:1.5px solid var(--rule)}
.tick{overflow:hidden;display:flex;align-items:center;min-width:0;border-right:1.5px solid var(--rule);min-height:48px;font-size:14px}
.track{display:inline-flex;gap:40px;white-space:nowrap;padding-left:16px;animation:marq var(--dur,30s) linear infinite}
.track b{font-weight:700}
@keyframes marq{to{transform:translateX(-50%)}}
.chat form{display:flex;min-width:0}
.chat input{flex:1;min-width:0;border:0;background:transparent;padding:0 12px;font:500 14px/1 var(--f-body)}
.chat input::placeholder{color:var(--dim)}
.chat form button{border-left:1.5px solid var(--rule);padding:0 14px;font:700 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.chat form button:hover{background:var(--accent);color:var(--on-accent)}

/* sections */
.block{border-bottom:1.5px solid var(--rule);padding-block:28px;display:grid;gap:20px}
.head{display:flex;align-items:end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}
.head h2{font-size:clamp(52px,7vw,104px)}
.head p{color:var(--dim);max-width:52ch}

/* visualizer */
.amp{background:#000;color:#00e000;border:1.5px solid var(--rule);display:grid;grid-template-columns:200px minmax(0,1fr)}
.amp .lcd{padding:14px;border-right:1.5px solid #222;display:grid;gap:8px;align-content:start;font-family:var(--f-pixel)}
.amp .time{font-size:40px;line-height:1;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.amp .kbps{font-size:11px;color:#9cff9c;display:flex;gap:10px;flex-wrap:wrap}
.amp .kbps span{border:1px solid #1d5f1d;padding:2px 4px}
.amp .marquee{overflow:hidden;white-space:nowrap;font-size:12px;border-top:1px solid #1d5f1d;padding-top:6px}
.amp .marquee span{display:inline-block;padding-left:100%;animation:mq 16s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
.amp canvas{width:100%;height:240px;display:block;cursor:pointer}
.amp-ctrl{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center}
.btns{display:flex;flex-wrap:wrap;gap:6px}

/* mixer */
.mixer{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr);border:1.5px solid var(--rule)}
.deck,.center{padding:18px;display:grid;gap:14px;align-content:start;min-width:0}
.deck+.center,.center+.deck{border-left:1.5px solid var(--rule)}
.deck .tag{display:flex;justify-content:space-between;align-items:center;gap:8px}
.deck .letter{font-family:var(--f-display);font-stretch:62%;font-weight:850;font-size:64px;line-height:.8}
.deck.live .letter{-webkit-text-stroke:0;color:var(--fg)}
.deck:not(.live) .letter{color:transparent;-webkit-text-stroke:1.5px var(--fg)}
.deck select{width:100%;border:1.5px solid var(--rule);background:var(--bg);padding:9px 10px;font:500 14px/1.2 var(--f-body);border-radius:0}
.deck .dname{font-family:var(--f-display);font-stretch:62%;font-weight:850;font-size:40px;line-height:.9;text-transform:uppercase;overflow-wrap:anywhere}
.deck .dshow{font-family:var(--f-serif);font-size:19px;line-height:1.15;min-height:2.3em;overflow-wrap:anywhere}
.meter{display:flex;gap:3px;height:16px}
.meter i{flex:1;background:var(--fg);opacity:.12}
.meter i.on{opacity:1}
.meter i.pk{background:var(--accent);opacity:1;box-shadow:inset 0 0 0 1.5px var(--fg)}
.range{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;min-width:0}
input[type=range]::-webkit-slider-runnable-track{height:1.5px;background:var(--rule)}
input[type=range]::-moz-range-track{height:1.5px;background:var(--rule)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-9px;background:var(--fg);border:0;border-radius:0}
input[type=range]::-moz-range-thumb{width:20px;height:20px;background:var(--fg);border:0;border-radius:0}
.xf{display:grid;gap:8px;padding:14px;border:1.5px solid var(--rule)}
.xf .ends{display:flex;justify-content:space-between;font-family:var(--f-display);font-stretch:62%;font-weight:850;font-size:34px;line-height:1}
.xf input[type=range]{height:40px}
.xf input[type=range]::-webkit-slider-thumb{width:26px;height:36px;margin-top:-17px;background:var(--accent);box-shadow:inset 0 0 0 1.5px var(--fg)}
.xf input[type=range]::-moz-range-thumb{width:26px;height:36px;background:var(--accent);box-shadow:inset 0 0 0 1.5px var(--fg)}
.note{color:var(--dim);font-size:13px;line-height:1.45}

/* stations */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1.5px solid var(--rule);border-left:1.5px solid var(--rule)}
.st{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:16px;border-right:1.5px solid var(--rule);border-bottom:1.5px solid var(--rule);min-width:0;transition:background .2s}
.st.a{background:var(--accent);color:var(--on-accent);--dim:var(--on-accent)}
.st .pick{display:grid;gap:6px;text-align:left;min-width:0}
.st .name{font-family:var(--f-display);font-stretch:62%;font-weight:850;font-size:46px;line-height:.88;text-transform:uppercase}
.st .pick:hover .name{text-decoration:underline;text-decoration-thickness:.05em;text-underline-offset:.1em}
.st .city{color:var(--dim)}
.st .what{font-family:var(--f-serif);font-size:19px;line-height:1.15;min-height:2.3em;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st .ab{display:grid;gap:4px;align-content:start}
.st .ab button{width:30px;height:30px;border:1.5px solid currentColor;font:700 12px/1 var(--f-body)}
.st .ab button[aria-pressed="true"]{background:currentColor}
.st .ab button[aria-pressed="true"] span{color:var(--bg)}
.st.a .ab button[aria-pressed="true"] span{color:var(--accent)}
.st .tune{color:var(--dim);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.st .tune i{width:8px;height:8px;background:currentColor;display:inline-block}

/* room */
.crowd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:20px;align-items:start}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people button,.people span.p{display:inline-flex;gap:8px;align-items:center;border:1.5px solid var(--rule);padding:6px 10px 5px;font:600 11px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase}
.people button:hover{background:var(--fg);color:var(--bg)}
.people i{width:10px;height:10px;flex:none}
footer{padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;gap:8px 20px;flex-wrap:wrap;color:var(--dim)}
footer a{color:var(--fg)}

@media (max-width:1000px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mixer{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .center{grid-column:1 / -1;grid-row:2;border-left:0!important;border-top:1.5px solid var(--rule)}
  .chat{grid-template-columns:minmax(0,1fr)}
  .chat .clbl{display:none}
  .tick{border-right:0;border-bottom:1.5px solid var(--rule)}
  .chat form{min-height:46px}
  .crowd{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .now{border-right:0;padding-right:0;border-bottom:1.5px solid var(--rule)}
  .frame{padding:var(--pad) 0}
  .amp{grid-template-columns:minmax(0,1fr)}
  .amp .lcd{border-right:0;border-bottom:1.5px solid #222}
  .themes button:not(.cycle){display:none}
  .themes .cycle{display:grid;place-items:center}
}
@media (max-width:560px){
  .grid,.mixer{grid-template-columns:minmax(0,1fr)}
  .deck+.center,.center+.deck{border-left:0;border-top:1.5px solid var(--rule)}
  .center{grid-row:auto}
  .st .name{font-size:40px}
  .count .clbl2{display:none}
  .mixbtn{border-left:1.5px solid var(--rule);border-top:0;width:100%;justify-content:center;min-height:44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.float{animation-duration:.01s}body.playing .onair i{animation:none}.box img{transform:none}.track,.amp .marquee span{animation:none}}
</style>
</head>
<body>
<header class="top wrap">
  <a class="logo" href="#">YOS<span>/</span>Radio</a>
  <span class="onair lab"><i></i><span id="onairText"></span></span>
  <span class="sp"></span>
  <span class="count"><b id="count">1</b><span class="lab clbl2" data-i="listening"></span></span>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en">EN</button><button type="button" data-lang="pl">PL</button>
  </div>
  <div class="themes" id="themes" role="group" data-ia="theme"></div>
</header>

<main>
  <section class="hero wrap">
    <div class="now">
      <p class="lab" id="nowMeta"></p>
      <h1 class="display"><a id="nowName" href="#" target="_blank" rel="noopener">NTS 1</a></h1>
      <p class="show serif" id="nowShow"></p>
      <div class="transport">
        <button class="play" id="play" type="button"><span id="playIcon">▶</span><span id="playText"></span></button>
        <div class="decks lab"><span>A</span><b id="deckA">—</b><span>B</span><b id="deckB">—</b></div>
        <button class="mixbtn lab" id="mixBtn" type="button" aria-expanded="false" aria-controls="mixSec"><span id="mixTxt"></span><span class="chev">▾</span></button>
      </div>
    </div>
    <figure class="frame">
      <div class="box" id="box">
        <img id="frame" src="img/c01.jpg" alt="YOS archive collage">
        <canvas id="ink"></canvas>
        <div class="floats" id="floats"></div>
      </div>
      <div class="rbar" id="reacts">
        <button class="rx" type="button" data-r="♥" aria-label="Love">♥</button>
        <button class="rx" type="button" data-r="WTF">WTF</button>
        <button class="rx" type="button" data-r="!!!">!!!</button>
        <button class="rx" type="button" data-r="+1">+1</button>
        <button class="tool" id="draw" type="button" aria-pressed="false" data-i="draw"></button>
        <div class="energy"><span class="lab dim" data-i="energy"></span><div class="segs" id="energy"></div></div>
      </div>
      <figcaption class="cap lab">
        <span><span data-i="frame"></span> <b id="frameNo">01</b>/30</span>

async function getJSON(url, retry = 1){
  try { const r = await fetch(url, { cache:'no-store' }); if (!r.ok) throw new Error(r.status); return await r.json(); }
  catch(e){ if (retry > 0){ await new Promise(res => setTimeout(res, 3000)); return getJSON(url, retry - 1); } throw e; }
}

/* ---------------- audio graph ---------------- */
const BPM = 118, STEP = 60000 / BPM / 4, BEAT = STEP * 4, BAR = BEAT * 4;
let ctx = null, master, filt, analyser;
function initAudio(){
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain(); master.gain.value = vol();
  filt = ctx.createBiquadFilter(); filt.type = 'lowpass'; filt.Q.value = 1.5; filt.frequency.value = cutHz();
  analyser = ctx.createAnalyser(); analyser.fftSize = 2048; analyser.smoothingTimeConstant = .72;
  filt.connect(analyser); filt.connect(master); master.connect(ctx.destination);
  decks.A.init(); decks.B.init(); applyXf(); applyCh();
}
const status = {};
const noCors = new Set();
class Deck {
  constructor(name){ this.name = name; this.st = null; }
  init(){
    this.ch = ctx.createGain(); this.xg = ctx.createGain();
    this.an = ctx.createAnalyser(); this.an.fftSize = 256;
    this.ch.connect(this.an); this.ch.connect(this.xg); this.xg.connect(filt);
    this.el = new Audio(); this.el.crossOrigin = 'anonymous'; this.el.preload = 'none';
    this.el.addEventListener('playing', () => { if (this.st) setStatus(this.st.id, ''); });
    this.el.addEventListener('waiting', () => { if (this.st) setStatus(this.st.id, 's_buf'); });
    this.el.addEventListener('error', () => { if (this.st && this.el.getAttribute('src')) this.fallback(); });
    this.src = ctx.createMediaElementSource(this.el); this.src.connect(this.ch);
    // fallback for streams that refuse cross-origin audio: plays straight out, no filter or visualizer
    this.plain = new Audio(); this.plain.preload = 'none';
    this.plain.addEventListener('playing', () => { if (this.st) setStatus(this.st.id, ''); });
    this.plain.addEventListener('error', () => { if (this.st && this.plain.getAttribute('src')) setStatus(this.st.id, 's_none'); });
  }
  set(st){ this.stop(); this.st = st; if (playing) this.start(); }
  start(){
    if (!this.st || !ctx) return;
    setStatus(this.st.id, 's_conn');
    if (noCors.has(this.st.id)) return this.fallback();
    this.el.src = this.st.stream; this.el.play().catch(() => {});
  }
  fallback(){
    if (!this.st) return;
    noCors.add(this.st.id);
    if (this.el.getAttribute('src')){ this.el.removeAttribute('src'); this.el.load(); }
    this.plain.src = this.st.stream; this.plain.volume = plainVol(this.name);
    this.plain.play().catch(() => setStatus(this.st.id, 's_none'));
  }
  get isPlain(){ return !!(this.plain && this.plain.getAttribute('src')); }
  stop(){
    if (this.el && this.el.getAttribute('src')){ this.el.pause(); this.el.removeAttribute('src'); this.el.load(); }
    if (this.plain && this.plain.getAttribute('src')){ this.plain.pause(); this.plain.removeAttribute('src'); this.plain.load(); }
  }
}
const decks = { A: new Deck('A'), B: new Deck('B') };
function setStatus(id, key){ status[id] = key; renderStatus(); }

/* hash for the shared-clock collage order */
function hash(n){ n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return n >>> 0; }

/* ---------------- transport & mixer ---------------- */
let playing = false, playStart = 0;
decks.A.st = byId[sget('yr-a')] || byId.nts1;
function setPlaying(on){
  playing = on; document.body.classList.toggle('playing', on);
  if (on) playStart = Date.now();
  if (on){ decks.A.start(); decks.B.start(); } else { decks.A.stop(); decks.B.stop(); }
  refreshAll(); announce();
}
$('#play').addEventListener('click', async () => { initAudio(); try { await ctx.resume(); } catch(e){} setPlaying(!playing); });
function assign(deck, st){
  initAudio(); ctx.resume().catch(() => {});
  const other = deck === 'A' ? 'B' : 'A';
  if (st && decks[other].st === st) decks[other].set(null);
  decks[deck].set(st);
  if (deck === 'A' && st) sset('yr-a', st.id);
  if (deck === 'B' && st){ if (+$('#xf').value === 0) setXf(50); setMixer(true, false); }
  if (!playing && st) setPlaying(true);
  refreshAll(); announce();
}
/* fold-out mixer */
function setMixer(open, scroll){
  $('#mixSec').hidden = !open; $('#mixBtn').setAttribute('aria-expanded', String(open));
  $('#mixTxt').textContent = open ? t('mix_close') : t('mix_open'); sset('yr-mix', open ? '1' : '0');
  if (open && scroll) $('#mixSec').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
}
$('#mixBtn').addEventListener('click', () => setMixer($('#mixSec').hidden, true));
const vol = () => (+$('#vol').value / 100) ** 1.6;
const chv = n => (+$('#ch' + n).value / 100) ** 1.4;
function plainVol(n){ const x = +$('#xf').value / 100; const g = n === 'A' ? Math.cos(x * Math.PI / 2) : Math.sin(x * Math.PI / 2); return Math.max(0, Math.min(1, vol() * g * chv(n))); }
function syncPlain(){ ['A','B'].forEach(n => { if (decks[n].plain) decks[n].plain.volume = plainVol(n); }); }
$('#vol').addEventListener('input', e => { $('#volV').textContent = e.target.value; if (master) master.gain.setTargetAtTime(vol(), ctx.currentTime, .03); syncPlain(); });
function applyCh(){ ['A','B'].forEach(n => { $('#ch' + n + 'v').textContent = $('#ch' + n).value; if (decks[n].ch) decks[n].ch.gain.setTargetAtTime(chv(n), ctx.currentTime, .03); }); syncPlain(); }
$('#chA').addEventListener('input', applyCh); $('#chB').addEventListener('input', applyCh);
const cutHz = () => 180 * 2 ** (+$('#cut').value / 100 * Math.log2(20000 / 180));
function cutLabel(){ const hz = cutHz(); $('#cutV').textContent = +$('#cut').value >= 100 ? t('open') : (hz >= 1000 ? (hz / 1000).toFixed(1) + 'k' : Math.round(hz)); }
$('#cut').addEventListener('input', () => { cutLabel(); if (filt) filt.frequency.setTargetAtTime(cutHz(), ctx.currentTime, .04); });

const NB = 38, peaks = new Float32Array(NB), peakHold = new Float32Array(NB);
let fbin = null, tbin = null, binMap = null;
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let tv1 = '#00ff95', tv2 = '#ffffff';
function readThemeViz(){ tv1 = cssv('--viz1') || tv1; tv2 = cssv('--viz2') || tv2; }
new MutationObserver(readThemeViz).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
readThemeViz();
function segColor(k){
  if (vpal === 'theme') return k > .72 ? tv2 : tv1;
  if (k > .8) return '#ff2a00'; if (k > .62) return '#ff9a00'; if (k > .45) return '#e8e800'; return k > .25 ? '#7ce000' : '#00c800';
}
/* band levels for the 3D modes */
let lowE = 0, midE = 0, highE = 0, lvl = 0, tunnelZ = 0, tunnelRot = 0, hueT = 0;
function bands(live){
  if (!live || !fbin){ lowE *= .92; midE *= .92; highE *= .92; lvl *= .92; return; }
  const avg = (a, b) => { let s = 0; for (let i = a; i < b; i++) s += fbin[i]; return s / (b - a) / 255; };
  const L = fbin.length;
  lowE = lowE * .6 + avg(1, Math.max(2, Math.round(L * .012))) * .4;
  midE = midE * .7 + avg(Math.round(L * .02), Math.round(L * .12)) * .3;
  highE = highE * .7 + avg(Math.round(L * .15), Math.round(L * .5)) * .3;
  lvl = lvl * .8 + (lowE * .5 + midE * .35 + highE * .15) * .2;
}
function drawBars(W, H, live){
  const gap = 3 * dpr, bw = (W - gap * (NB - 1)) / NB, sh = 4 * dpr, sg = 1.5 * dpr, rows = Math.floor(H / (sh + sg));
  for (let i = 0; i < NB; i++){
    let v = 0;
    if (live){ let m = 0; for (let j = binMap[i]; j <= Math.max(binMap[i], binMap[i + 1] - 1); j++) m = Math.max(m, fbin[j]); v = Math.max(0, Math.min(1, (m / 255 - .12) / .72)); }
    const lit = Math.round(v * rows), x = i * (bw + gap);
    for (let r = 0; r < lit; r++){ gv.fillStyle = segColor(r / rows); gv.fillRect(x, H - (r + 1) * (sh + sg), bw, sh); }
    if (lit >= peaks[i]){ peaks[i] = lit; peakHold[i] = 18; } else if (peakHold[i] > 0) peakHold[i]--; else peaks[i] = Math.max(0, peaks[i] - .35);
    if (peaks[i] > .5){ gv.fillStyle = vpal === 'theme' ? tv2 : '#c8c8c8'; gv.fillRect(x, H - Math.ceil(peaks[i]) * (sh + sg) - sh, bw, sh * .6); }
  }
}
function drawScope(W, H, live){
  const n = tbin ? tbin.length : 0;
  gv.lineWidth = 2 * dpr;
  [[0, vpal === 'theme' ? tv1 : '#ffd400'], [1, vpal === 'theme' ? tv2 : '#00e0ff']].forEach(([o, c]) => {
    gv.strokeStyle = c; gv.globalAlpha = o ? .45 : 1; gv.beginPath();
    for (let x = 0; x < W; x += 2 * dpr){ const v = live && n ? (tbin[(Math.floor(x / W * n) + o * 37) % n] - 128) / 128 : 0; const y = H / 2 + v * H * (o ? .3 : .45); x ? gv.lineTo(x, y) : gv.moveTo(x, y); }
    gv.stroke();
  });
  gv.globalAlpha = 1;
}
/* flying through a square tunnel: rings come toward you, lowE pushes speed and size, mids twist it */
function drawTunnel(W, H, live){
  gv.fillStyle = 'rgba(0,0,0,.28)'; gv.fillRect(0, 0, W, H);
  const N = 26, base = Math.min(W, H) * .07, tm = performance.now() / 1000;
  tunnelZ += .0035 + lowE * .02 + (playing ? .002 : 0);
  tunnelRot += .002 + midE * .03;
  hueT += .4 + highE * 4;
  const cx = W / 2 + Math.sin(tm * .7) * W * .08 * (.3 + midE), cy = H / 2 + Math.cos(tm * .53) * H * .1 * (.3 + midE);
  const off = tunnelZ * N, fr = off - Math.floor(off), base0 = Math.floor(off);
  for (let k = N; k >= 1; k--){
    const z = (k - fr) / N; // 0 near .. 1 far
    if (z <= 0) continue;
    const id = k + base0; // stable ring identity so colours don't jump
    const depth = z * .95 + .05;
    let r = base / depth;
    const bi = binMap ? Math.min(NB - 1, Math.floor((1 - z) * NB * .7)) : 0;
    if (live && fbin) r *= 1 + (fbin[binMap[bi]] / 255) * .35;
    if (r > Math.hypot(W, H)) continue;
    const ang = tunnelRot + z * (2 + midE * 6);
    const x0 = cx + (W / 2 - cx) * (1 - depth), y0 = cy + (H / 2 - cy) * (1 - depth);
    gv.save(); gv.translate(x0, y0); gv.rotate(ang);
    gv.globalAlpha = Math.min(1, (1 - z) * 1.4);
    gv.lineWidth = Math.max(1, (1 - z) * 7 * dpr * (.6 + lowE));
    gv.strokeStyle = vpal === 'theme' ? (id % 2 ? tv1 : tv2) : `hsl(${(id * 14 + hueT) % 360} 100% ${50 + highE * 20}%)`;
    gv.strokeRect(-r, -r * .62, r * 2, r * 1.24);
    gv.restore();
  }
  gv.globalAlpha = 1;
  // centre glow on kicks
  if (lowE > .55){ gv.fillStyle = vpal === 'theme' ? tv1 : '#ffffff'; gv.globalAlpha = (lowE - .55) * 1.6; gv.fillRect(cx - 4 * dpr, cy - 4 * dpr, 8 * dpr, 8 * dpr); gv.globalAlpha = 1; }
}
/* warp: a starfield whose speed follows the music */
const STARS = Array.from({ length: 360 }, () => ({ x: (Math.random() - .5) * 2, y: (Math.random() - .5) * 2, z: Math.random() }));
function drawWarp(W, H){
  gv.fillStyle = 'rgba(0,0,0,.35)'; gv.fillRect(0, 0, W, H);
  const speed = .0025 + lvl * .05 + lowE * .02, cx = W / 2, cy = H / 2, f = Math.min(W, H) * .5;
  gv.lineCap = 'square';
  STARS.forEach((s, i) => {
    const pz = s.z; s.z -= speed;
    if (s.z <= .02){ s.x = (Math.random() - .5) * 2; s.y = (Math.random() - .5) * 2; s.z = 1; return; }
    const x1 = cx + s.x / pz * f, y1 = cy + s.y / pz * f, x2 = cx + s.x / s.z * f, y2 = cy + s.y / s.z * f;
    if (x2 < 0 || x2 > W || y2 < 0 || y2 > H){ s.z = 1; s.x = (Math.random() - .5) * 2; s.y = (Math.random() - .5) * 2; return; }
    gv.strokeStyle = vpal === 'theme' ? (i % 5 ? tv2 : tv1) : `hsl(${(i * 3 + hueT) % 360} 100% ${60 + (1 - s.z) * 30}%)`;
    gv.lineWidth = Math.max(1, (1 - s.z) * 3.2 * dpr);
    gv.beginPath(); gv.moveTo(x1, y1); gv.lineTo(x2, y2); gv.stroke();
  });
  hueT += .3 + highE * 3;
}
function drawViz(){
  const W = viz.width, H = viz.height;
  const live = playing && analyser && !(leadDeck().isPlain);
  if (analyser){
    if (!fbin){ fbin = new Uint8Array(analyser.frequencyBinCount); tbin = new Uint8Array(analyser.fftSize); binMap = [];
      const nyq = ctx.sampleRate / 2; for (let i = 0; i <= NB; i++) binMap.push(Math.min(fbin.length - 1, Math.round(40 * (16000 / 40) ** (i / NB) / nyq * fbin.length))); }
    analyser.getByteFrequencyData(fbin); analyser.getByteTimeDomainData(tbin);
  }
  bands(live);
  if (vmode === 'bars' || vmode === 'scope'){
    gv.fillStyle = '#000'; gv.fillRect(0, 0, W, H);
    gv.fillStyle = vpal === 'theme' ? 'rgba(255,255,255,.07)' : 'rgba(0,200,0,.08)';
    for (let y = 0; y < H; y += 8 * dpr) for (let x = 0; x < W; x += 8 * dpr) gv.fillRect(x, y, dpr, dpr);
    if (vmode === 'bars') drawBars(W, H, live); else drawScope(W, H, live);
  }
  else if (vmode === 'tunnel') drawTunnel(W, H, live);
  else drawWarp(W, H);
  if (playing && leadDeck().isPlain){ gv.fillStyle = '#00e000'; gv.font = `${12 * dpr}px Silkscreen, monospace`; gv.fillText('NO SIGNAL DATA FROM THIS STREAM', 14 * dpr, 24 * dpr); }
}

/* deck meters */
const meterBins = new Uint8Array(128);
['mA','mB'].forEach(id => { for (let i = 0; i < 20; i++) $('#' + id).append(document.createElement('i')); });
function drawMeter(n){
  if ($('#mixSec').hidden) return;
  const d = decks[n], el = $('#m' + n).children; let lv = 0;
  if (playing && d.an && d.st && !d.isPlain){ d.an.getByteTimeDomainData(meterBins); let s = 0; for (let i = 0; i < meterBins.length; i++){ const v = (meterBins[i] - 128) / 128; s += v * v; } lv = Math.min(1, Math.sqrt(s / meterBins.length) * 3.2); }
  else if (playing && d.isPlain) lv = .35 + Math.random() * .1;
  const on = Math.round(lv * el.length);
  for (let i = 0; i < el.length; i++) el[i].className = i < on ? (i >= el.length - 4 ? 'pk' : 'on') : '';
}

function resize(){
  dpr = Math.min(2, devicePixelRatio || 1);
  const b = canvas.getBoundingClientRect(); canvas.width = Math.round(b.width * dpr); canvas.height = Math.round(b.height * dpr);
  const v = viz.getBoundingClientRect(); viz.width = Math.round(v.width * dpr); viz.height = Math.round(v.height * dpr);
  gv.fillStyle = '#000'; gv.fillRect(0, 0, viz.width, viz.height);
}
addEventListener('resize', resize); resize();

/* ---------------- main loop ---------------- */
const box = $('#box'), frameImg = $('#frame');
let lastBar = -1;
function loop(){
  const now = Date.now(), pnow = performance.now();
  decayEnergy();
  const lit = Math.round(energy * 16); [...segEl.children].forEach((s, i) => s.className = i < lit ? (i >= 11 ? 'hot' : 'on') : '');
  box.classList.toggle('hype', hype());
  if (flick > 0){
    const unit = BEAT * flick / (hype() ? 2 : 1);
    const slot = Math.floor(now / unit) * (hype() ? 3 : 1);
    if (slot !== lastSlot){ lastSlot = slot; const i = hash(Math.floor(now / unit)) % IMGS.length; frameImg.src = IMGS[i]; $('#frameNo').textContent = String(i + 1).padStart(2, '0'); }
  }
  box.style.setProperty('--pulse', playing && !reduce ? ((1 - (now % BEAT) / BEAT) ** 3).toFixed(3) : 0);
  const bar = Math.floor(now / BAR);
  if (playing){ const s = Math.floor((now - playStart) / 1000); $('#ltime').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }

  g2.clearRect(0, 0, canvas.width, canvas.height); g2.lineCap = 'round'; g2.lineJoin = 'round'; g2.lineWidth = 6 * dpr;
  for (let i = strokes.length - 1; i >= 0; i--){
    const s = strokes[i], age = pnow - s.t; if (s !== cur && age > 7000){ strokes.splice(i, 1); continue; }
    g2.globalAlpha = s === cur ? 1 : Math.min(1, (7000 - age) / 3000); g2.strokeStyle = col(s.h); g2.beginPath();
    s.pts.forEach((p, j) => { const X = p[0] * canvas.width, Y = p[1] * canvas.height; j ? g2.lineTo(X, Y) : g2.moveTo(X, Y); });
    if (s.pts.length === 1) g2.lineTo(s.pts[0][0] * canvas.width + .1, s.pts[0][1] * canvas.height);
    g2.stroke();
  }
  g2.globalAlpha = 1;
  drawViz(); drawMeter('A'); drawMeter('B');
  requestAnimationFrame(loop);
}

setMixer(sget('yr-mix') === '1', false);
setVmode(vmode); setVpal(vpal);
applyLang(); applyXf(); refreshMeta(); setInterval(refreshMeta, 45000);
connect(); requestAnimationFrame(loop);
})();
</script>
